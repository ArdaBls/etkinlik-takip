<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" id="theme-color-meta" content="#12211f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Etkinlik Takip" />
    <meta name="description" content="Etkinlik Takip yönetici kullanıcı izinleri." />
    <title>Kullanıcı izinleri | Etkinlik Takip</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="admin-page app-pending dark-theme">
    <div class="page-glow glow-one" aria-hidden="true"></div>
    <div class="page-glow glow-two" aria-hidden="true"></div>

    <header class="site-header">
      <a class="brand" href="./" aria-label="Etkinlik Takip ana uygulama">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 21c5-3.1 8-6.6 8-11V5.8L12 3 4 5.8V10c0 4.4 3 7.9 8 11Z" /><path d="m8.5 12 2.2 2.2 4.8-5" /></svg>
        </span>
        <span>Etkinlik <strong>Takip</strong></span>
      </a>
      <div class="header-actions">
        <a class="button button-ghost button-small" href="./">Uygulamaya dön</a>
        <button class="button button-ghost button-small auth-logout" id="auth-logout" type="button" hidden>Çıkış</button>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Koyu temaya geç">
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.5" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.4 15.1A8.4 8.4 0 0 1 8.9 3.6 8.4 8.4 0 1 0 20.4 15.1Z" /></svg>
        </button>
      </div>
    </header>

    <main class="admin-page-main">
      <section class="users-section section-shell" id="user-access">
        <div class="section-heading-row">
          <div>
            <p class="section-kicker">Yönetici alanı</p>
            <h1>Kullanıcı izinleri</h1>
            <p>Kayıt olan ev sorumlularını inceleyin, çalışma alanı izinlerini yönetin.</p>
          </div>
          <span class="admin-pending-badge admin-pending-badge-large" id="pending-user-count" hidden>0 bekleyen</span>
        </div>
        <div class="users-list" id="users-list"></div>
        <div class="audit-log-heading"><h2>Son değişiklikler</h2><p>Etkinlik ve yönetim işlemleri değiştirilemez günlük olarak tutulur.</p></div>
        <div class="audit-log-list" id="audit-log-list"></div>
      </section>
    </main>

    <footer class="site-footer section-shell"><span>Etkinlik Takip</span><span>Yalnızca yönetici</span></footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script src="./firebase-config.js"></script>
    <script src="./admin-users.js?v=2"></script>
  </body>
</html>
